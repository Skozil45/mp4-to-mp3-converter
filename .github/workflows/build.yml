name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name MP4toMP3 --collect-all customtkinter --collect-all tkinterdnd2 --collect-all imageio_ffmpeg app.py
      - uses: actions/upload-artifact@v4
        with:
          name: MP4toMP3-windows
          path: dist/MP4toMP3.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MP4toMP3.exe
